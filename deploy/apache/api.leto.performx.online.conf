# API VITE (NestJS sur 127.0.0.1:3100) + temps réel Socket.IO (WebSocket).
# Certbot ajoutera la version HTTPS (443) et la redirection.
<VirtualHost *:80>
    ServerName api.leto.performx.online

    ProxyRequests Off
    ProxyPreserveHost On
    ProxyTimeout 120
    RequestHeader set X-Forwarded-Proto expr=%{REQUEST_SCHEME}

    # WebSocket (temps réel : positions des livreurs, statuts, propositions de prix)
    RewriteEngine On
    RewriteCond %{HTTP:Upgrade} =websocket [NC]
    RewriteRule ^/(.*) ws://127.0.0.1:3100/$1 [P,L]

    ProxyPass        / http://127.0.0.1:3100/
    ProxyPassReverse / http://127.0.0.1:3100/

    # Photos : 5 Mo max côté API
    LimitRequestBody 6291456
    # APK de l'app (back-office › Landing page) : jusqu'à 200 Mo, uniquement sur cette adresse
    <Location "/admin/landing/apk">
        LimitRequestBody 209715200
    </Location>

    ErrorLog ${APACHE_LOG_DIR}/leto-api-error.log
    CustomLog ${APACHE_LOG_DIR}/leto-api-access.log combined
</VirtualHost>
