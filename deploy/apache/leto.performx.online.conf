# Back-office VITE (fichiers statiques). Certbot ajoutera la version HTTPS (443) et la redirection.
<VirtualHost *:80>
    ServerName leto.performx.online
    DocumentRoot /var/www/leto/backoffice

    <Directory /var/www/leto/backoffice>
        Options -Indexes
        AllowOverride None
        Require all granted
        FallbackResource /index.html
    </Directory>

    # Fichiers versionnés par Vite : cache long ; index.html : jamais en cache
    <Directory /var/www/leto/backoffice/assets>
        Header set Cache-Control "public, max-age=31536000, immutable"
    </Directory>
    <Files "index.html">
        Header set Cache-Control "no-cache"
    </Files>

    ErrorLog ${APACHE_LOG_DIR}/leto-backoffice-error.log
    CustomLog ${APACHE_LOG_DIR}/leto-backoffice-access.log combined
</VirtualHost>
